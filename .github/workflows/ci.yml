name: Verify Doorstep

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: doorstep/package-lock.json
      - run: npm ci --prefix doorstep
      - run: npm test
        env:
          RUN_NETWORK_TESTS: "1"
